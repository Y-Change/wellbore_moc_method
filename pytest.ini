[pytest]
pythonpath = .
testpaths = tests
markers =
    e2e: End-to-end sensitivity experiment acceptance test suite
    tier1: Tier 1 simulation convergence and time series completeness
    tier2: Tier 2 schema moc_lhs_v2.1 compatibility and physical constraints
    tier3: Tier 3 sensitivity metrics and summary JSON completeness
    tier4: Tier 4 publication figures and DPI verification
    tier5: Tier 5 academic research report completeness
