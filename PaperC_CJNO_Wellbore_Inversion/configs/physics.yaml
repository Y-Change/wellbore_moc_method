# physics.yaml — 几何、流体、井筒、边界、单位制（SI）与阶段一数值/验收设定
# 依据：攻关执行方案_v2.md §2.1–§2.3、§2.5、§2.6、§3
schema_version: 1
units: SI            # m, s, kg, Pa, m^3/s; 水头 H 为测压管水头（含高程），p = rho*g*(H - z)
constants:
  g: 9.80665

# ---------------------------------------------------------------- 状态变量与阻抗约定（§2.1）
state_variables: [H, Q]          # 内部实现用 [H, Q]；特征阻抗 B = a/(g A) [s m^-2]
impedance_pQ_form: rho*a/A       # 仅在频域 TMM（p–Q 体系）中使用，绝不与 [H,Q] 传播矩阵混用
gravity_term: "含于 g A H_x；MOC 不再加 g A sin(theta)（避免重力双计）"
convective_term_omitted_order: V/a   # 省略对流项的量级，论文假设节声明
long_wave_check:
  rule: "f_sig * D / a << 1"
  f_sig_max_hz: 100.0
  D_max: 0.125
  a_min: 1250.0
  value_max: 1.0e-2              # 100*0.125/1250 = 0.01 -> 一维长波近似成立

# ---------------------------------------------------------------- 参考井（典型算例，§2.5）
reference_well:
  L: 4000.0                      # 井筒总测深 [m]
  D: 0.114                       # 内径 [m]
  a: 1400.0                      # 波速 [m/s]
  rho: 1000.0                    # [kg/m^3]
  nu: 1.0e-6                     # 运动黏度 [m^2/s]
  roughness: 4.5e-5              # 绝对粗糙度 [m]
  TVD: 3000.0                    # 垂深；轨迹 z(x) = -min(x, TVD)（直井段 + 水平段理想化）
  Q0: 0.05                       # 停泵前末级排量 [m^3/s]
  t_s: 1.0                       # 停泵起始时刻 [s]（前置稳态段）
  t_c: 0.1                       # 关阀（排量归零）持续时间 [s]，余弦 ramp
  ramp: cosine
  toe_bc: dead_end
  clusters:
    N: 8
    spacing: 20.0
    L_toe: 60.0                  # 末簇至趾端距离 [m]
    perfs_per_cluster: 8
    Cd: 0.75
    d_perf: 0.010                # 孔眼直径 [m]
    kappa: 1.0e+6                # 迂曲系数 [Pa s^0.5 m^-1.5]（独立加性项，§2.3）
    I_f: 5.0e+5                  # 逐孔 [Pa s^2 m^-3]
    R_f: 1.0e+8                  # 逐孔 [Pa s m^-3]
    C_f: 3.0e-7                  # 逐孔 [m^3 Pa^-1]（簇级 = 逐孔求和）
    G_l: 5.0e-11                 # 逐孔 [m^3 Pa^-1 s^-1]（簇级 = 逐孔求和）
    p_res: 4.0e+7                # 储层压力 [Pa]（水平段各簇同 TVD -> 同一 H_res，能量审计参考头）

# ---------------------------------------------------------------- 采样域（pilot/Sobol；§3.1、§3.2）
# 逐孔参数仅用于正演数据生成；反演目标预注册为簇级等效量（§2.3）
sampling_domain:
  train:
    L:        {dist: uniform,    low: 3000.0,  high: 5000.0}
    D:        {dist: uniform,    low: 0.095,   high: 0.125}
    a:        {dist: uniform,    low: 1250.0,  high: 1500.0}
    rho:      {dist: uniform,    low: 990.0,   high: 1060.0}
    nu:       {dist: loguniform, low: 0.8e-6,  high: 3.0e-6}
    roughness: {dist: loguniform, low: 1.5e-5, high: 1.0e-4}
    TVD_frac: {dist: uniform,    low: 0.55,    high: 0.80}     # TVD = TVD_frac * (x_1 - 200 m)，保证水平段含全部簇
    Q0:       {dist: uniform,    low: 0.02,    high: 0.10}
    t_c:      {dist: loguniform, low: 0.03,    high: 1.0}
    N_clusters: {dist: int_uniform, low: 4, high: 12}
    spacing:  {dist: uniform,    low: 12.0,    high: 40.0}
    spacing_jitter_frac: {dist: uniform, low: 0.0, high: 0.15}   # 逐簇间距随机扰动比例（连续位置，非落网）
    L_toe:    {dist: uniform,    low: 20.0,    high: 100.0}
    perfs_per_cluster: {dist: int_uniform, low: 4, high: 12}
    Cd:       {dist: uniform,    low: 0.60,    high: 0.90}
    d_perf:   {dist: uniform,    low: 0.008,   high: 0.012}
    perf_heterogeneity_cv: {dist: uniform, low: 0.0, high: 0.15}  # 逐孔 Cd*A 相对离散
    kappa:    {dist: loguniform, low: 1.0e+5,  high: 5.0e+6}
    I_f_cluster: {dist: loguniform, low: 1.0e+4, high: 1.0e+6}   # 簇级等效（逐孔 = 簇级 * M）
    R_f_cluster: {dist: loguniform, low: 1.0e+6, high: 1.0e+8}   # 簇级等效（逐孔 = 簇级 * M）
    C_f_cluster: {dist: loguniform, low: 5.0e-7, high: 1.0e-5}   # 簇级（逐孔 = 簇级 / M）
    G_l_cluster: {dist: loguniform, low: 1.0e-10, high: 3.0e-9}  # 簇级（逐孔 = 簇级 / M）
    cluster_heterogeneity_cv: {dist: uniform, low: 0.0, high: 0.30}   # 簇间 RCI 参数离散
    p_res_grad: {dist: uniform,  low: 9.0e+3,  high: 1.5e+4}    # 储层压力梯度 [Pa/m]，p_res = grad * TVD
  ood:
    dense_spacing:  {spacing: {low: 10.0, high: 12.0}}
    sparse_spacing: {spacing: {low: 40.0, high: 60.0}}
    many_clusters:  {N_clusters: {low: 13, high: 16}}
    tail_viscosity: {nu: {low: 3.0e-6, high: 1.0e-5}}
    tail_compliance: {C_f_cluster: {low: 1.0e-5, high: 5.0e-5}}
    uncooccurring:  {description: "高 Q0 × 密簇 × 高 I_f 等训练域内边缘组合"}
    deleted_cluster: {description: "随机删除 1 簇（等效流通量置 0）"}
    impedance_jump: {description: "首簇 Cd*A 放大 3x 或缩小 1/3 的阻抗突变井"}
  rejection_rules:
    p_wh_steady_min: 5.0e+6       # 稳态井口压力过低 -> 拒绝并记录
    p_wh_steady_max: 1.2e8        # 稳态井口压力过高 -> 拒绝并记录
    min_cluster_spacing: 10.0

# ---------------------------------------------------------------- 数值设定（§2.2、§3.1）
numerics:
  Nx_ref_levels: [512, 1024, 2048]     # 三网格；最细档兼作阶段三 challenge case 真值生成
  Cr_levels: [1.0, 0.8]                # 双档；Cr=1 为高频衰减/到时验收基准，Cr=0.8 给差异说明
  production: {Nx_ref: 1024, Cr_target: 1.0}
  grid_strategy: segmentwise_dx_exact_cluster_nodes   # 见 grid.py 文档：簇节点精确落位，短段 Cr_j<=1 线性插值
  interpolation: linear_space_line                    # Ghidaoui & Karney (1994) 弥散量级在阶段结论中给出
  friction_time_scheme: trapezoidal    # 二阶（Wylie–Streeter）；explicit（足点显式）作为对照选项
  inertia_scheme: exp_trapezoidal      # 近井惯性 ODE：线性强迫下精确、L-稳定（h=R_f dt/I_f 可达 O(10)）
  storage_scheme: crank_nicolson       # 储容 ODE：CN（方案规定）
  storage_stiff_guard: true            # G_l dt / C_f > 1（CN 振荡区）时切换为指数积分器并计数
  tortuosity_regularisation: "phi(q) = q / sqrt(|q| + eps_q), eps_q = 1e-6 * Q0"
  newton: {tol_dimless: 1.0e-8, max_iter: 100, max_inner: 100, damping: bracketed_safeguarded_newton}
  window_periods: 20.0                 # 时窗 >= 20 个往返周期 4L/a（§3.2）
  wavefront_sampling_min_points: 5     # 上升时间内 >= 5 个采样点 -> t_c >= 5 dt（§3.2）

# ---------------------------------------------------------------- 能量收支（§2.6）
energy_audit:
  E_tot: "井筒压缩势能 + 动能 + 裂缝 C_f/I_f 储能；记忆变量不计入"
  memory_storage_KYP: "E_mem = rho A sum_l w/(2 alpha_l beta_l) (z_l - alpha_l V)^2；用于被动性检查的备选路径"
  passive_window_rule: "仅在井口流量为零后检查 E(t+dt)-E(t) <= 1e-8 (相对停泵时刻能量)"
  port_imbalance_threshold: 1.0e-4
  passivity_threshold: 1.0e-8

# ---------------------------------------------------------------- 验收门（§3.3）
gates:
  joukowsky_cr1_rel_err: 1.0e-6
  joukowsky_cr08_rel_err: 1.0e-3
  shunt_reflection_rel_err: 1.0e-2
  rci_response_peak_rel_err: 1.0e-2
  bergant_envelope_rel_err: 5.0e-2
  tmm_resonance_rel_err: 5.0e-3
  richardson_order_min: 1.8
  three_grid_peak_diff: 5.0e-3
  first_arrival_diff: 2.0e-3
  node_mass_residual: 1.0e-6
  port_energy_imbalance: 1.0e-4
  newton_convergence_rate: 0.999
  kernel_direct_vs_recursive_l2: 1.0e-2
  kernel_phase_lag_deg: 1.0
  kernel_fit_rel_err: 2.0e-2
  hf_arrival_gate_ms: 3.5            # §4.3 s_min/(2a) 到时门，用于 s_min=10 m 专项预算对照
