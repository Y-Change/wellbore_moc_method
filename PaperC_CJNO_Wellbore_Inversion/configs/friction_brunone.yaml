# friction_brunone.yaml — Brunone 瞬时加速度模型（对比分支，§2.4(c)）
# 与 Zielke/Vardy–Brown 分支物理机制不同，全文任何位置不得合并称为“非定常摩阻”。
schema_version: 1
model: brunone_instantaneous_acceleration
coefficient_convention: k                    # J_u = k(...)，不用 k/2（锁定）
k_from_vardy_shear_decay:
  formula: "k = sqrt(C*) / 2"
  C_star_laminar: 0.00476                    # Re < 2300
  C_star_turbulent: "7.41 / Re^(log10(14.3 / Re^0.05))"
  reference: "Bergant, Simpson & Vítkovský (2001) J. Hydraul. Res. 39(3):249–257, DOI 10.1080/00221680109499828"
applicable_Re: {low: 1.0e+3, high: 1.0e+7}
Re_definition: "初始稳态 Re = |Q_seg| D / (nu A)，逐段取值（趾端以下无流段取层流值）"

# ---- 两种符号约定（均已实现，单元测试覆盖特征速度与 sgn 切换）
conventions:
  plan_v2:
    formula: "J_u = k (V_t - a sgn(V V_x) V_x)"
    characteristic_speeds:
      sgn_plus:  ["-a", "a/(1+k)"]           # sgn(V V_x) = +1: (1+k)V_t + gH_x - k a V_x = 0
      sgn_minus: ["+a", "-a/(1+k)"]          # sgn(V V_x) = -1: 对称切换
    energy_audit_result: "在井口关阀（上游阀）井筒构型中累计非定常功为负（反耗散），见 01_stage_conclusion.md §Brunone"
  vitkovsky2000:
    formula: "J_u = k (V_t + a sgn(V) |V_x|) = k (V_t + a sgn(V V_x) V_x)"
    characteristic_speeds:
      sgn_plus:  ["+a", "-a/(1+k)"]
      sgn_minus: ["-a", "a/(1+k)"]
    energy_audit_result: "累计非定常功 >= 0（耗散），与 Vítkovský et al. (2000) 符号修正一致"
locked_convention: vitkovsky2000
lock_rationale: >
  方案 v2 书写形式 k(V_t - a sgn(VV_x)V_x) 在 sgn=+1 分支即原始 Brunone 形式；本井筒问题阀门在上游（井口），
  能量审计显示该形式对停泵水击注入能量（W_unsteady < 0），违反 R7 被动性要求；Vítkovský (2000) 符号修正形式
  在同一算例上给出 W_unsteady >= 0。按“失败 -> 定位修复 -> 记录”流程锁定为 vitkovsky2000，plan_v2 保留为可切换对照。
  该结论仅对上述具体变体与固定 ±a 模板 + 滞后源项近似成立。

# ---- 离散与滞后策略
discretisation:
  template: fixed_pm_a_characteristics       # 固定 ±a 特征线模板 + 滞后源项（不修改传播速度）
  V_t: "(V^n - V^(n-1)) / dt，在特征线足点插值"
  V_x: "节点中心差分（段端单侧差分），在足点插值"
  sgn_switch: "逐点、逐步按 sgn(V V_x)（或 sgn(V)）切换，含流向反转 golden"
  lag: one_step
