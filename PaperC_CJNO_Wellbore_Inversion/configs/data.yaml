# data.yaml — 采样、切分、噪声与测量链（§3.1、§3.2、§2.5）
schema_version: 1

pilot:
  design: maximin_lhs                 # scipy.stats.qmc.LatinHypercube(optimization='random-cd') + maximin 重采样择优
  n: 2000
  seed: 20260905
  n_candidates: 8                     # 生成候选设计数，取最小点间距最大者
  purpose: "参数域覆盖检查 + Newton 失败率；通过后冻结生成器"
  numerics: {Nx_ref: 1024, Cr_target: 1.0, friction_model: zvb_rec}
  window_periods: 20.0

formal:
  design: sobol_owen_scrambled        # scipy.stats.qmc.Sobol(scramble=True)（Owen scrambling）
  seeds: [42, 43, 44, 45, 46, 47, 48, 49]
  n_train: 20000
  n_val: 3000
  n_id_test: 3000
  n_ood: 4000
  split_rule: >
    按“井（几何/流体）× 簇布局 × 激励事件”三元组分组切分：同一 case 的全部时间窗只进入一个 split，
    禁止相邻时间窗跨 split（防泄漏）；切分在 manifest 中以 group_id 与 split 字段冻结，R8 检查交叉重叠必须为空。
  ood_design: [dense_spacing, sparse_spacing, many_clusters, tail_viscosity, tail_compliance, uncooccurring, deleted_cluster, impedance_jump]
  numerics: {Nx_ref: 1024, Cr_target: 1.0, friction_model: zvb_rec}
  # --formal --smoke：小规模走通 Sobol+OOD+schema，不启动 30k 仿真
  smoke:
    n_train: 8
    n_val: 4
    n_id_test: 4
    n_ood: 8                          # 每类 OOD 1 例
    numerics: {Nx_ref: 256, Cr_target: 1.0, friction_model: zvb_rec}
    window_periods: 2.0

storage:
  format: npz_compressed              # zarr 不在环境中，等价用 numpy savez_compressed
  per_case_fields: [params, grid, friction, seed, t, p_head, Q_j, p_j, sum_q_j, p_c_j, z_memory]
  p_head_rate: full                   # 井口全采样率 fp32
  node_traces: {full_rate_window_periods: 3.0, decimation_after: 16}
  memory_states: {where: cluster_nodes_both_sides, decimation: 16}
  full_field_snapshots: {case_fraction: 0.02, time_fraction: 0.01}   # 全场仅抽样 1–5%
  sha256: per_file_manifest

observation_model:                    # y = M_psi G(theta, eta; u_r) + eps（阶段三使用，此处冻结定义）
  sampling_rate_hz: {default: 1000.0, range: [250.0, 2000.0]}
  sensor_transfer_function: {type: second_order_lowpass, f_n_hz: 400.0, zeta: 0.6}
  antialias_filter: {type: butterworth, order: 4, cutoff_fraction_of_nyquist: 0.8}
  noise: {type: additive_gaussian, snr_db: [inf, 30, 20, 10, 5], impulsive_outlier_fraction: [0.01, 0.03]}
  f_eff_definition: >
    观测链端到端传函（传感器 × 抗混叠滤波）的 -3 dB 点；备用核算：井口信号 PSD 能量 95% 分位频率。
    带宽约束：f_eff >= a/(2 s_min) ≈ 70 Hz（a=1400, s_min=10 m），f_s >= 2.5–3 f_eff。
  arrival_error_propagation: "delta_x ≈ (a/2) delta_tau + (tau/2) delta_a（仅直觉引导，不保证唯一解）"

nyquist_budget:                       # §2.5 按 Cr=1 计
  dx_4m: {dt_ms: 2.86, nyquist_hz: 175}
  dx_4m_cr08: {dt_ms: 2.29, nyquist_hz: 219}
  s_min_reflection_hz: 70
