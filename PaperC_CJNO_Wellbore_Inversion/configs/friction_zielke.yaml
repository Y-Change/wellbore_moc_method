schema_version: 1
model: zielke_vardy_brown_memory_convolution
nondimensional_time: tau = 4 nu t / D^2
reference_path:
  type: direct_history_convolution_piecewise_complete_W
  zielke_small_tau_series:
    tau_split: 0.02
    m:
    - 0.282095
    - -1.25
    - 1.057855
    - 0.9375
    - 0.396696
    - -0.351563
    powers:
    - -0.5
    - 0.0
    - 0.5
    - 1.0
    - 1.5
    - 2.0
  zielke_large_tau_exponents:
  - 26.3744
  - 70.8493
  - 135.0198
  - 218.9216
  - 322.5544
  vardy_brown:
    A_star: 0.28209479177387814
    C_star: 12.86 / Re^kappa, kappa = log10(15.29 / Re^0.0567)
    valid_Re:
    - 2300.0
    - 100000000.0
  laminar_turbulent_switch_Re: 2300.0
  step_weights: Wbar_k = (1/dt) int_{k dt}^{(k+1) dt} W(4 nu u / D^2) du (analytic
    antiderivatives)
  complexity: O(N_x N_t^2) time, O(N_x N_t) memory — goldens and kernel-fit reference
    only
  prehistory: z_l(0) = 0 <=> fully developed steady flow before the disturbance; non-steady
    prehistory must be supplied via z_l(0)
production_path:
  type: exponential_recursive_kernel
  M: 12
  recursion: dz_l/dt = -beta_l z_l + alpha_l dV/dt,  J_uV = w sum_l z_l,  w = 16 nu/D^2,
    alpha_l = m_l, beta_l = 4 nu n_l / D^2
  exact_step_update: z^{n+1} = exp(-beta dt) z^n + alpha phi1(beta dt) (V^{n+1} -
    V^n)
  positivity_constraint: m_l, n_l > 0 enforced structurally (log-parametrised fit)
    + assertion after fit
  fit:
    objective: log least squares + minimax (IRLS) refinement
    domain_tau:
    - 1.0e-08
    - 100.0
    powerlaw_domain_tau:
    - 1.0e-08
    - 1.0
    negligible_weight_rule: points with W < 1e-16 W(tau_min) carry zero weight (below
      double-precision relevance)
    gate_max_rel_err: 0.02
  reynolds_dependence: 'VB scaling law: {m_l, n_l + 1/C*(Re)} exact for every turbulent
    Re (no binning error); laminar uses the Zielke fit'
  complexity: O(N_x M N_t)
