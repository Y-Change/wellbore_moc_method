smoke: true
physics:
  schema_version: 1
  units: SI
  constants:
    g: 9.80665
  state_variables:
  - H
  - Q
  impedance_pQ_form: rho*a/A
  gravity_term: 含于 g A H_x；MOC 不再加 g A sin(theta)（避免重力双计）
  convective_term_omitted_order: V/a
  long_wave_check:
    rule: f_sig * D / a << 1
    f_sig_max_hz: 100.0
    D_max: 0.125
    a_min: 1250.0
    value_max: 0.01
  reference_well:
    L: 4000.0
    D: 0.114
    a: 1400.0
    rho: 1000.0
    nu: 1.0e-06
    roughness: 4.5e-05
    TVD: 3000.0
    Q0: 0.05
    t_s: 1.0
    t_c: 0.1
    ramp: cosine
    toe_bc: dead_end
    clusters:
      N: 8
      spacing: 20.0
      L_toe: 60.0
      perfs_per_cluster: 8
      Cd: 0.75
      d_perf: 0.01
      kappa: 1000000.0
      I_f: 500000.0
      R_f: 100000000.0
      C_f: 3.0e-07
      G_l: 5.0e-11
      p_res: 40000000.0
  sampling_domain:
    train:
      L:
        dist: uniform
        low: 3000.0
        high: 5000.0
      D:
        dist: uniform
        low: 0.095
        high: 0.125
      a:
        dist: uniform
        low: 1250.0
        high: 1500.0
      rho:
        dist: uniform
        low: 990.0
        high: 1060.0
      nu:
        dist: loguniform
        low: 8.0e-07
        high: 3.0e-06
      roughness:
        dist: loguniform
        low: 1.5e-05
        high: 0.0001
      TVD_frac:
        dist: uniform
        low: 0.55
        high: 0.8
      Q0:
        dist: uniform
        low: 0.02
        high: 0.1
      t_c:
        dist: loguniform
        low: 0.03
        high: 1.0
      N_clusters:
        dist: int_uniform
        low: 4
        high: 12
      spacing:
        dist: uniform
        low: 12.0
        high: 40.0
      spacing_jitter_frac:
        dist: uniform
        low: 0.0
        high: 0.15
      L_toe:
        dist: uniform
        low: 20.0
        high: 100.0
      perfs_per_cluster:
        dist: int_uniform
        low: 4
        high: 12
      Cd:
        dist: uniform
        low: 0.6
        high: 0.9
      d_perf:
        dist: uniform
        low: 0.008
        high: 0.012
      perf_heterogeneity_cv:
        dist: uniform
        low: 0.0
        high: 0.15
      kappa:
        dist: loguniform
        low: 100000.0
        high: 5000000.0
      I_f_cluster:
        dist: loguniform
        low: 10000.0
        high: 1000000.0
      R_f_cluster:
        dist: loguniform
        low: 1000000.0
        high: 100000000.0
      C_f_cluster:
        dist: loguniform
        low: 5.0e-07
        high: 1.0e-05
      G_l_cluster:
        dist: loguniform
        low: 1.0e-10
        high: 3.0e-09
      cluster_heterogeneity_cv:
        dist: uniform
        low: 0.0
        high: 0.3
      p_res_grad:
        dist: uniform
        low: 9000.0
        high: 15000.0
    ood:
      dense_spacing:
        spacing:
          low: 10.0
          high: 12.0
      sparse_spacing:
        spacing:
          low: 40.0
          high: 60.0
      many_clusters:
        N_clusters:
          low: 13
          high: 16
      tail_viscosity:
        nu:
          low: 3.0e-06
          high: 1.0e-05
      tail_compliance:
        C_f_cluster:
          low: 1.0e-05
          high: 5.0e-05
      uncooccurring:
        description: 高 Q0 × 密簇 × 高 I_f 等训练域内边缘组合
      deleted_cluster:
        description: 随机删除 1 簇（等效流通量置 0）
      impedance_jump:
        description: 首簇 Cd*A 放大 3x 或缩小 1/3 的阻抗突变井
    rejection_rules:
      p_wh_steady_min: 5000000.0
      p_wh_steady_max: 120000000.0
      min_cluster_spacing: 10.0
  numerics:
    Nx_ref_levels:
    - 512
    - 1024
    - 2048
    Cr_levels:
    - 1.0
    - 0.8
    production:
      Nx_ref: 1024
      Cr_target: 1.0
    grid_strategy: segmentwise_dx_exact_cluster_nodes
    interpolation: linear_space_line
    friction_time_scheme: trapezoidal
    inertia_scheme: exp_trapezoidal
    storage_scheme: crank_nicolson
    storage_stiff_guard: true
    tortuosity_regularisation: phi(q) = q / sqrt(|q| + eps_q), eps_q = 1e-6 * Q0
    newton:
      tol_dimless: 1.0e-08
      max_iter: 100
      max_inner: 100
      damping: bracketed_safeguarded_newton
    window_periods: 20.0
    wavefront_sampling_min_points: 5
  energy_audit:
    E_tot: 井筒压缩势能 + 动能 + 裂缝 C_f/I_f 储能；记忆变量不计入
    memory_storage_KYP: E_mem = rho A sum_l w/(2 alpha_l beta_l) (z_l - alpha_l V)^2；用于被动性检查的备选路径
    passive_window_rule: 仅在井口流量为零后检查 E(t+dt)-E(t) <= 1e-8 (相对停泵时刻能量)
    port_imbalance_threshold: 0.0001
    passivity_threshold: 1.0e-08
  gates:
    joukowsky_cr1_rel_err: 1.0e-06
    joukowsky_cr08_rel_err: 0.001
    shunt_reflection_rel_err: 0.01
    rci_response_peak_rel_err: 0.01
    bergant_envelope_rel_err: 0.05
    tmm_resonance_rel_err: 0.005
    richardson_order_min: 1.8
    three_grid_peak_diff: 0.005
    first_arrival_diff: 0.002
    node_mass_residual: 1.0e-06
    port_energy_imbalance: 0.0001
    newton_convergence_rate: 0.999
    kernel_direct_vs_recursive_l2: 0.01
    kernel_phase_lag_deg: 1.0
    kernel_fit_rel_err: 0.02
    hf_arrival_gate_ms: 3.5
data:
  schema_version: 1
  pilot:
    design: maximin_lhs
    n: 2000
    seed: 20260905
    n_candidates: 8
    purpose: 参数域覆盖检查 + Newton 失败率；通过后冻结生成器
    numerics:
      Nx_ref: 1024
      Cr_target: 1.0
      friction_model: zvb_rec
    window_periods: 20.0
  formal:
    design: sobol_owen_scrambled
    seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    - 47
    - 48
    - 49
    n_train: 20000
    n_val: 3000
    n_id_test: 3000
    n_ood: 4000
    split_rule: '按“井（几何/流体）× 簇布局 × 激励事件”三元组分组切分：同一 case 的全部时间窗只进入一个 split， 禁止相邻时间窗跨
      split（防泄漏）；切分在 manifest 中以 group_id 与 split 字段冻结，R8 检查交叉重叠必须为空。

      '
    ood_design:
    - dense_spacing
    - sparse_spacing
    - many_clusters
    - tail_viscosity
    - tail_compliance
    - uncooccurring
    - deleted_cluster
    - impedance_jump
    numerics:
      Nx_ref: 1024
      Cr_target: 1.0
      friction_model: zvb_rec
    smoke:
      n_train: 8
      n_val: 4
      n_id_test: 4
      n_ood: 8
      numerics:
        Nx_ref: 256
        Cr_target: 1.0
        friction_model: zvb_rec
      window_periods: 2.0
  storage:
    format: npz_compressed
    per_case_fields:
    - params
    - grid
    - friction
    - seed
    - t
    - p_head
    - Q_j
    - p_j
    - sum_q_j
    - p_c_j
    - z_memory
    p_head_rate: full
    node_traces:
      full_rate_window_periods: 3.0
      decimation_after: 16
    memory_states:
      where: cluster_nodes_both_sides
      decimation: 16
    full_field_snapshots:
      case_fraction: 0.02
      time_fraction: 0.01
    sha256: per_file_manifest
  observation_model:
    sampling_rate_hz:
      default: 1000.0
      range:
      - 250.0
      - 2000.0
    sensor_transfer_function:
      type: second_order_lowpass
      f_n_hz: 400.0
      zeta: 0.6
    antialias_filter:
      type: butterworth
      order: 4
      cutoff_fraction_of_nyquist: 0.8
    noise:
      type: additive_gaussian
      snr_db:
      - inf
      - 30
      - 20
      - 10
      - 5
      impulsive_outlier_fraction:
      - 0.01
      - 0.03
    f_eff_definition: '观测链端到端传函（传感器 × 抗混叠滤波）的 -3 dB 点；备用核算：井口信号 PSD 能量 95% 分位频率。 带宽约束：f_eff
      >= a/(2 s_min) ≈ 70 Hz（a=1400, s_min=10 m），f_s >= 2.5–3 f_eff。

      '
    arrival_error_propagation: delta_x ≈ (a/2) delta_tau + (tau/2) delta_a（仅直觉引导，不保证唯一解）
  nyquist_budget:
    dx_4m:
      dt_ms: 2.86
      nyquist_hz: 175
    dx_4m_cr08:
      dt_ms: 2.29
      nyquist_hz: 219
    s_min_reflection_hz: 70
friction_zielke_M: 12
brunone_locked: vitkovsky2000
